services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: etf-trend-backend
    ports:
      - "8300:8300"
    volumes:
      - ${HOME}/.market_data:/root/.market_data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MARKET_DATA_DIR=/root/.market_data/parquet
    env_file:
      - .env
    networks:
      - etf-trend-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_BASE=http://localhost:8300
    container_name: etf-trend-frontend
    ports:
      - "3200:3200"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=http://localhost:8300
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - etf-trend-network

networks:
  etf-trend-network:
    driver: bridge
