services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: etf-trend-backend
    restart: unless-stopped
    ports:
      - "8300:8300"
    volumes:
      - ${HOME}/.market_data:/root/.market_data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MARKET_DATA_DIR=/root/.market_data/parquet
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - etf-trend-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_BASE=http://localhost:8300
    container_name: etf-trend-frontend
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=http://localhost:8300
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - etf-trend-network

networks:
  etf-trend-network:
    driver: bridge
